<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civify Extension</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../lib/jspdf.umd.min.js"></script>
    <script src="../lib/api.js"></script>
    <script src="../lib/pdf-generator.js"></script>
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view hidden">
            <div class="logo-container">
                <picture>
                    <source srcset="../icons/icon128-dark.png" media="(prefers-color-scheme: dark)">
                    <source srcset="../icons/icon128-dark.png" media="(prefers-color-scheme: no-preference)">
                    <img src="../icons/icon128.png" alt="Civify Logo">
                </picture>
                <h1>Civify</h1>
                <p>Tailor your resume instantly</p>
            </div>
            <div class="input-group">
                <label for="api-key">API Key</label>
                <input type="password" id="api-key" placeholder="Enter your Civify API Key">
            </div>
            <button id="login-btn" class="btn-primary">Login</button>
            <p class="helper-text">Don't have a key? <a href="https://civify.cv" target="_blank">Get one here</a></p>
        </div>

        <!-- Main View -->
        <div id="main-view" class="view hidden">
            <header>
                <div class="user-info">
                    <span id="user-name">User</span>
                    <span id="credits-badge" class="badge">0 Credits</span>
                </div>
                <button id="logout-btn" class="icon-btn" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </header>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="mask">Mask CV</button>
                <button class="tab-btn" data-tab="tailor">Tailor CV</button>
            </div>

            <!-- Mask Tab -->
            <div id="mask-tab" class="tab-content active">
                <div class="upload-area" id="mask-drop-zone">
                    <div class="icon">📄</div>
                    <p>Drag & Drop Resume (PDF)</p>
                    <input type="file" id="mask-file-input" accept=".pdf" hidden>
                    <button class="btn-secondary" onclick="document.getElementById('mask-file-input').click()">Browse</button>
                </div>
                <div id="mask-file-info" class="file-info hidden">
                    <span id="mask-filename">resume.pdf</span>
                    <button id="mask-remove-file" class="close-btn">×</button>
                </div>
                <button id="mask-btn" class="btn-primary" disabled>Mask PII & Download</button>
            </div>

            <!-- Tailor Tab -->
            <div id="tailor-tab" class="tab-content">
                <div class="upload-area" id="tailor-drop-zone">
                    <div class="icon">📄</div>
                    <p>Upload Resume (PDF)</p>
                    <input type="file" id="tailor-file-input" accept=".pdf" hidden>
                    <button class="btn-secondary" onclick="document.getElementById('tailor-file-input').click()">Browse</button>
                </div>
                <div id="tailor-file-info" class="file-info hidden">
                    <span id="tailor-filename">resume.pdf</span>
                    <button id="tailor-remove-file" class="close-btn">×</button>
                </div>
                
                <div class="job-input-area">
                    <label>Job Description</label>
                    <div class="jd-actions">
                        <button id="scrape-jd-btn" class="btn-small">
                            Generate from LinkedIn
                        </button>
                    </div>
                    <textarea id="job-description" placeholder="Paste job description or use 'Generate from LinkedIn'"></textarea>
                </div>

                <div class="options">
                     <label><input type="checkbox" id="generate-cover-letter"> Cover Letter</label>
                </div>

                <button id="tailor-btn" class="btn-primary" disabled>Tailor & Download</button>
            </div>
        </div>

        <!-- Status Message (OUTSIDE both views so it's always visible) -->
        <div id="status-message" class="hidden"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
