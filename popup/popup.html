<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">Civify Extension</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../lib/jspdf.umd.min.js"></script>
    <script src="../lib/i18n.js"></script>
    <script src="../lib/api.js"></script>
    <script src="../lib/pdf-generator.js"></script>
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="view hidden">
            <div class="logo-container">
                <img id="auth-logo" src="../icons/icon128-dark.png" alt="Civify Logo">
                <h1 data-i18n="appTitle">Civify</h1>
                <p data-i18n="appSubtitle">Tailor your resume instantly</p>
            </div>
            <div class="input-group">
                <label for="api-key" data-i18n="apiKeyLabel">API Key</label>
                <input type="password" id="api-key" data-i18n="apiKeyPlaceholder" placeholder="Enter your Civify API Key">
            </div>
            <button id="login-btn" class="btn-primary" data-i18n="loginBtn">Login</button>
            <p class="helper-text"><span data-i18n="dontHaveKey">Don't have a key?</span> <a href="https://civify.cv" target="_blank" data-i18n="getKeyLink">Get one here</a></p>
        </div>

        <!-- Main View -->
        <div id="main-view" class="view hidden">
            <header>
                <div class="brand">
                    <img id="header-logo" src="../icons/icon48-dark.png" alt="Civify">
                    <span class="brand-name" data-i18n="appTitle">Civify</span>
                </div>
                
                <div class="header-controls">
                    <div class="user-info">
                        <span id="credits-badge" class="badge">0 Credits</span>
                        <span id="user-name">User</span>
                    </div>
                    <div class="header-actions">
                         <button id="settings-btn" class="icon-btn" title="Settings">
                            <!-- Standard Gear Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                        <button id="logout-btn" class="icon-btn" title="Logout" data-i18n="logoutTitle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Settings Overlay -->
            <div id="settings-overlay" class="overlay hidden">
                <div class="settings-panel">
                    <div class="settings-header">
                        <h2 data-i18n="settingsTitle">Settings</h2>
                        <button id="close-settings" class="close-btn">×</button>
                    </div>
                    
                    <div class="setting-item">
                        <label data-i18n="themeLabel">Theme</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" data-value="dark" data-setting="theme" data-i18n="themeDark">Dark</button>
                            <button class="toggle-btn" data-value="light" data-setting="theme" data-i18n="themeLight">Light</button>
                        </div>
                    </div>

                    <div class="setting-item">
                        <label data-i18n="languageLabel">Language</label>
                        <div class="toggle-group">
                            <button class="toggle-btn active" data-value="en" data-setting="lang" data-i18n="langEn">English</button>
                            <button class="toggle-btn" data-value="ar" data-setting="lang" data-i18n="langAr">Arabic</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="mask" data-i18n="tabMask">Mask CV</button>
                <button class="tab-btn" data-tab="tailor" data-i18n="tabTailor">Tailor CV</button>
            </div>

            <!-- Mask Tab -->
            <div id="mask-tab" class="tab-content active">
                <div class="upload-area" id="mask-drop-zone">
                    <div class="icon">📄</div>
                    <p data-i18n="dragDropMask">Drag & Drop Resume (PDF)</p>
                    <input type="file" id="mask-file-input" accept=".pdf" hidden>
                    <button class="btn-secondary" id="mask-browse-btn" data-i18n="browse">Browse</button>
                </div>
                <div id="mask-file-info" class="file-info hidden">
                    <span id="mask-filename">resume.pdf</span>
                    <button id="mask-remove-file" class="close-btn">×</button>
                </div>
                <button id="mask-btn" class="btn-primary" disabled data-i18n="maskBtn">Mask PII & Download</button>
            </div>

            <!-- Tailor Tab -->
            <div id="tailor-tab" class="tab-content">
                <div class="upload-area" id="tailor-drop-zone">
                    <div class="icon">📄</div>
                    <p data-i18n="dragDropTailor">Upload Resume (PDF)</p>
                    <input type="file" id="tailor-file-input" accept=".pdf" hidden>
                    <button class="btn-secondary" id="tailor-browse-btn" data-i18n="browse">Browse</button>
                </div>
                <div id="tailor-file-info" class="file-info hidden">
                    <span id="tailor-filename">resume.pdf</span>
                    <button id="tailor-remove-file" class="close-btn">×</button>
                </div>
                
                <div class="job-input-area">
                    <label data-i18n="jdLabel">Job Description</label>
                    <div class="jd-actions">
                        <button id="scrape-jd-btn" class="btn-small" data-i18n="scrapeBtn">
                            Generate from LinkedIn
                        </button>
                    </div>
                    <textarea id="job-description" data-i18n="jdPlaceholder" placeholder="Paste job description or use 'Generate from LinkedIn'"></textarea>
                </div>

                <div class="options-group">
                    <label class="group-label" data-i18n="templateLabel">Template</label>
                    <div class="template-selector">
                        <button class="template-btn active" data-template="modern">
                            <span class="color-dot" style="background-color: #000000;"></span>
                            <span data-i18n="templateModern">Modern</span>
                        </button>
                        <button class="template-btn" data-template="classic">
                            <span class="color-dot" style="background-color: #374151;"></span>
                            <span data-i18n="templateClassic">Classic</span>
                        </button>
                        <button class="template-btn" data-template="creative">
                            <span class="color-dot" style="background-color: #6366f1;"></span>
                            <span data-i18n="templateCreative">Creative</span>
                        </button>
                    </div>
                </div>

                <div class="options">
                     <label><input type="checkbox" id="generate-cover-letter"> <span data-i18n="coverLetterLabel">Cover Letter</span></label>
                </div>

                <button id="tailor-btn" class="btn-primary" disabled data-i18n="tailorBtn">Tailor & Download</button>
            </div>
        </div>

        <!-- Results Overlay (Cover Letter) -->
        <div id="results-overlay" class="overlay hidden">
            <div class="results-panel">
                <div class="results-header">
                    <h2 data-i18n="coverLetterTitle">Cover Letter</h2>
                    <button id="close-results" class="close-btn">×</button>
                </div>
                
                <div class="ats-badge hidden" id="ats-score-badge">
                    <span data-i18n="atsScoreLabel">ATS Score</span>
                    <span class="score-value" id="ats-score-value">--</span>
                </div>

                <textarea id="cover-letter-text" readonly></textarea>
                
                <div class="results-actions">
                    <button id="copy-btn" class="btn-secondary">
                        <span class="icon">📋</span> <span data-i18n="copyBtn">Copy</span>
                    </button>
                    <!-- PDF download is automatic, but we could add a re-download button here if needed -->
                </div>
            </div>
        </div>

        <!-- Status Message (OUTSIDE both views so it's always visible) -->
        <div id="status-message" class="hidden"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
